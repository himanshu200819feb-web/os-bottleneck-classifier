# Single source of truth for the whole project.
# Every run copies this file into runs/<run_id>/config.yaml.

seed: 42

data:
  source_url: https://raw.githubusercontent.com/NetManAIOps/OmniAnomaly/master/ServerMachineDataset
  raw_dir: data/raw/SMD
  # "all" or an explicit list such as [machine-1-1, machine-1-2]
  machines: all

features:
  window: 10            # rolling window (minutes) for mean/std features
  long_window: 60       # window for the slow-drift feature
  extras: []            # optional: diff (sudden jumps), long_dev (slow drift)

evaluation:
  n_folds: 4            # GroupKFold over machines
  calibration_fraction: 0.25   # share of training machines held out to tune thresholds
  train_stride: 5       # keep every 5th normal row when fitting (all anomaly rows kept)
  max_fit_rows: 60000   # cap on rows used to fit any model
  event_gap: 5          # merge alarms closer than this many minutes into one incident
  # How supervised models get their alarm threshold:
  #   holdout  - fit on 75% of training machines, tune the threshold on the other 25%
  #   crossfit - 3-way cross-fitting: tune on all training machines, then fit on all of them
  # crossfit won on all 28 servers: average supervised F1 0.294 -> 0.311, PR-AUC up for all 6.
  calibration: crossfit
  crossfit_parts: 3

models:
  # ---- supervised: learn from labelled anomalies on other machines
  logistic_regression:
    enabled: true
    params: {C: 1.0, max_iter: 2000}
  random_forest:
    enabled: true
    params: {n_estimators: 150, max_depth: 14, min_samples_leaf: 3}
  xgboost:
    enabled: true
    params: {n_estimators: 200, max_depth: 6, learning_rate: 0.1, subsample: 0.8, colsample_bytree: 0.8}
  lightgbm:
    enabled: true
    params: {n_estimators: 300, num_leaves: 31, learning_rate: 0.05, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8, min_child_samples: 20}
  knn:
    enabled: true
    max_fit_rows: 15000
    params: {n_neighbors: 15, weights: distance}
  mlp:                  # neural network
    enabled: true
    params: {hidden_layer_sizes: [128, 64], alpha: 0.001, batch_size: 256, learning_rate_init: 0.001, max_iter: 200}
  # ---- unsupervised: learn each machine's own normal behaviour, no labels
  isolation_forest:
    enabled: true
    params: {n_estimators: 200, max_samples: 512}
  one_class_svm:
    enabled: true
    max_fit_rows: 8000
    params: {nu: 0.05, gamma: scale}
  local_outlier_factor:
    enabled: true
    max_fit_rows: 15000
    params: {n_neighbors: 30}
  autoencoder:          # neural network
    enabled: true
    max_fit_rows: 12000
    params: {hidden: [64, 16, 64], alpha: 0.0001, max_iter: 80}

runs:
  dir: runs

rca:
  # Tried in order; if every model fails, the offline rule-based report is used.
  # Override with GEMINI_MODELS=a,b,c in .env.
  # gemini-3.1-flash-lite is a fast last resort: the bigger models often time out under high demand.
  models: [gemini-4-hydrogen, gemini-3.8-flash, gemini-3.6-flash, gemini-3.1-flash-lite]
  timeout_seconds: 40     # per model
  temperature: 0.2
  top_k_metrics: 6

dashboard:
  host: 127.0.0.1
  port: 8000
  max_points: 1500     # points per series sent to the browser
